function expiryInfo(dateStr) {
  const days = Math.ceil((new Date(dateStr) - TODAY) / 86400000);
  if (days <= 0) return {
    status: "expired",
    label: "Expired",
    days
  };
  if (days === 1) return {
    status: "critical",
    label: "Today",
    days
  };
  if (days <= 3) return {
    status: "warn",
    label: `${days}d left`,
    days
  };
  return {
    status: "good",
    label: `${days}d`,
    days
  };
}
function recalcExpiry(category, opened) {
  const rule = EXPIRY_RULES[category] || EXPIRY_RULES["Other"];
  return daysOut(opened ? rule.opened : rule.unopened);
}

// ─────────────────────────────────────────────────────────────
// REDUCER
// ─────────────────────────────────────────────────────────────
function reducer(state, action) {
  switch (action.type) {
    case "RESET":
      return {
        ...SEED
      };
    case "ADD_PANTRY":
      return {
        ...state,
        pantry: [...state.pantry, {
          ...action.item,
          id: `p${Date.now()}`
        }]
      };
    case "DEL_PANTRY":
      return {
        ...state,
        pantry: state.pantry.filter(p => p.id !== action.id)
      };
    case "OPEN_ITEM":
      {
        const item = state.pantry.find(p => p.id === action.id);
        if (!item) return state;
        const newExpiry = recalcExpiry(item.category, true);
        if (action.qty !== undefined && action.qty < item.qty) {
          // Split: opened partial + remaining unopened
          const opened = {
            ...item,
            id: `p${Date.now()}`,
            qty: action.qty,
            opened: true,
            expiry: newExpiry
          };
          const remaining = {
            ...item,
            qty: item.qty - action.qty
          };
          return {
            ...state,
            pantry: [...state.pantry.filter(p => p.id !== item.id), opened, remaining]
          };
        }
        return {
          ...state,
          pantry: state.pantry.map(p => p.id === action.id ? {
            ...p,
            opened: true,
            expiry: newExpiry
          } : p)
        };
      }
    case "MARK_USED":
      return {
        ...state,
        pantry: state.pantry.filter(p => p.id !== action.id)
      };
    case "SET_MEAL":
      return {
        ...state,
        mealPlan: {
          ...state.mealPlan,
          [action.day]: {
            ...state.mealPlan[action.day],
            [action.slot]: action.value
          }
        }
      };
    case "ADD_GROCERY":
      return {
        ...state,
        groceryLog: [action.entry, ...state.groceryLog]
      };
    case "POST_COMMUNITY":
      return {
        ...state,
        community: [action.item, ...state.community]
      };
    case "CLAIM":
      return {
        ...state,
        community: state.community.map(c => c.id === action.id ? {
          ...c,
          status: "claimed"
        } : c),
        credits: state.credits - (state.community.find(c => c.id === action.id)?.credits || 0)
      };
    case "EARN_CREDITS":
      return {
        ...state,
        credits: state.credits + action.amount
      };
    case "DISMISS_NOTIF":
      return {
        ...state,
        notifications: state.notifications.filter(n => n.id !== action.id)
      };
    case "UPDATE_USER":
      return {
        ...state,
        user: {
          ...state.user,
          ...action.updates
        }
      };
    case "INC_STREAK":
      return {
        ...state,
        zeroWasteStreak: state.zeroWasteStreak + 1
      };
    default:
      return state;
  }
}

async function callClaude(system, user) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system,
      messages: [{
        role: "user",
        content: user
      }]
    })
  });
  const data = await res.json();
  return JSON.parse((data.content?.[0]?.text || "{}").replace(/```json|```/g, "").trim());
}
